version: 0.0
os: linux
files:
  - source: /
    destination: /home/ec2-user/app/
permissions:
  - object: /home/ec2-user/app/deploy-scripts/start.sh
    mode: "755"
    owner: ec2-user
    group: ec2-user
hooks:
  AfterInstall:
    - location: deploy-scripts/start.sh
      timeout: 60
      runas: root
